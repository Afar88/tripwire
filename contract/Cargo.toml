[package]
name = "tripwire-registry"
version = "0.1.0"
edition = "2021"
description = "Tripwire: an open on-chain scam/risk registry for NEAR that wallets and AI agents query before sending funds."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
