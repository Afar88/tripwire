[package]
name = "tripwire-guard-vault"
version = "0.1.0"
edition = "2021"
description = "Tripwire guard vault: an AI agent can only request a payment; the vault checks the Tripwire registry and caps before it pays."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
